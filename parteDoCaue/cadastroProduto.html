<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro de produtos</title>


    <link rel="stylesheet" href="cadastroProduto.css">
</head>
<body>

<Header>
    <nav>
        <div class="logo">

            <p>WP imports</p>

        </div>
        <ul>
            <li><a href="#home">home</a></li>
            <li><a href="#categorias">categorias</a></li>
            <li><a href="#produtos">produtos</a></li>            
        </ul>

        <div>
            <input id="nav-input" type="text" placeholder="buscar produtos..." >
            <label for="nav-input">🔎</label>
        </div>
    </nav>
</Header>


<div id="banner">

    <img src="" alt="imagem vai ficar aqui">

    <div>

        <button> adicionar produtos</button>

    </div>

</div>

<div>
    <input placeholder="buscar produtos..." id="buscar-produtos" type="text">

    <div id="remover-adicionar">
        <button onclick="abrirCadastro()">➕</button>
        <button onclick="excluirProdutos()">🗑️</button> 
    </div>

</div>
<div id="cadastros">

    <div >
        <label for="categorias">Categorias</label>
        <select name="class-categoria" id="select-categoria-filtro" onchange="filtrarProdutos()">

        </select>
    </div>

    <div id="produtos">

        <div id="container-produto">

        </div>
        
    </div>

</div>

<!-- // caixa de cadastro de produtos -->
<dialog id="cadastro-produto-modal">

    
    <div id="dialog-input-container">
        <div>
            <label for="input-nome">Nome:</label>
            <input type="text" id="input-nome">    
        </div>

        <div>
            <label for="input-tamanho">Tamanho:</label>
            <input type="text" id="input-tamanho">
        </div>

        <div>
            <label for="input-custo">Custo:</label>
            <input type="text" id="input-custo">
        </div>

        <div>
            <label for="input-valor-atacado">Valor atacado:</label>
            <input type="text" id="input-valor-atacado">
        </div>

        <div>
            <label for="input-valor-varejo">Valor varejo:</label>
            <input type="text" id="input-valor-varejo">
        </div>
        
        <div>
            <label for="input-qtd">Quantidade:</label>
            <input type="text" id="input-qtd">
        </div>
        
        <div>
            <label for="select-categoria-cadastro">Categoria:</label>
            <select name="catagoria" id="select-categoria-cadastro">
                
            </select>
        </div>
    </div>

    <div id="dialog-button-container">
        <div>
            <button onclick="fecharCadastro()">cancelar</button>
        </div>
        
        <div>
            <button onclick="salvarCadastro()">📁</button>
        </div>

    

    </div>


</dialog>

<!-- /// caixa de ediçao de produtos -->
<dialog id="editar-produto-modal">


    <div id="input-edicao-container">
        <div>
            <label for="input-edicao-nome">Nome:</label>
            <input type="text" id="input-edicao-nome">
        </div>

        <div>
            <label for="input-edicao-tamanho">Tamanho:</label>
            <input type="text" id="input-edicao-tamanho">
        </div>

        <div>
            <label for="input-edicao-custo">Custo</label>
            <input type="text" id="input-edicao-custo">
        </div>

        <div>
            <label for="input-edicao-valor-atacado">Valor Atacado:</label>
            <input type="text" id="input-edicao-valor-atacado">
        </div>

        <div>
            <label for="input-edicao-valor-vaarejo">Valor Varejo:</label>
            <input type="text" id="input-edicao-valor-varejo">
        </div>

    <div id="botao-edicao-container">

        <div>
            <button onclick="cancelarEdicao()">cancelar</button>
        </div>

        <div>
            <button onclick="salvarEdicao()">📁</button>
        </div>
        
    </div>  

</dialog>


    <script src="cadastroProduto.js"></script>
</body>
</html>
