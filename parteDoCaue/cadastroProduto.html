<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro de produtos</title>


    <link rel="stylesheet" href="cadastroProduto.css">
</head>
<body>

<Header>
    <nav>
        <div class="logo">

            <p>WP imports</p>

        </div>
        <ul>
            <li><a href="#home">home</a></li>
            <li><a href="#categorias">categorias</a></li>
            <li><a href="#produtos">produtos</a></li>            
        </ul>

        <div>
            <input id="nav-input" type="text" placeholder="buscar produtos..." >
            <label for="nav-input">🔎</label>
        </div>
    </nav>
</Header>


<div id="banner">
    <img src="banner.png" alt="imagem vai ficar aqui">
</div>


<div>
    <div id="remover-adicionar">
        <button onclick="abrirCadastro()">➕</button>
        <button onclick="excluirProdutos()">🗑️</button> 
    </div>

</div>
<div id="cadastros">

    <div id="categoria-div">
        <label for="categorias">Categorias</label>
        <select name="class-categoria" id="select-categoria-filtro" onchange="filtrarProdutos()">
        </select>
        <button onclick="abrirCadastroCat()">+</button>
    </div>
    
    <div id="produtos">
        <div id="container-produto">  </div>
    </div>
</div>

<div id="cadastroCategoria">
    
    <h2>Categorias:</h2>
    <div>
        <button onclick="excluirCategoria()">🗑️</button>
    </div>

    <div id="container-categoria">


    </div>
</div>




<!-- // caixa de cadastro de produtos -->
<dialog id="cadastro-produto-modal">

    <div id="dialog-input-container">
        <div>
            <label for="input-nome">Nome:</label> <br>
            <input type="text" id="input-nome">    
        </div>

        <div>
            <label for="input-tamanho">Tamanho:</label> <br>
            <input type="text" id="input-tamanho">
        </div>

        <div>
            <label for="input-custo">Custo:</label> <br>
            <input type="number" id="input-custo">
        </div>

        <div>
            <label for="input-valor-atacado">Valor atacado:</label> <br>
            <input type="number" id="input-valor-atacado">
        </div>

        <div>
            <label for="input-valor-varejo">Valor varejo:</label> <br>
            <input type="number" id="input-valor-varejo">
        </div>
        
        <div>
            <label for="input-qtd">Quantidade:</label> <br>
            <input type="number" id="input-qtd">
        </div>
        
        <div>
            <label for="select-categoria-cadastro">Categoria:</label> 
            <select name="catagoria" id="select-categoria-cadastro">
                
            </select>
        </div>
    </div>

    <div id="dialog-button-container">
        <div>
            <button class="cancelar" onclick="fecharCadastro()">❌</button>
        </div>
        
        <div>
            <button class="salvar" onclick="salvarCadastro()">✅</button>
        </div>
    </div>


</dialog>

<!-- /// caixa de ediçao de produtos -->
<dialog id="editar-produto-modal">


    <div id="input-edicao-container">
        <div>
            <label for="input-edicao-nome">Nome:</label> <br>
            <input type="text" id="input-edicao-nome">
        </div>

        <div>
            <label for="input-edicao-tamanho">Tamanho:</label> <br>
            <input type="text" id="input-edicao-tamanho">
        </div>

        <div>
            <label for="input-edicao-custo">Custo</label><br>
            <input type="number" id="input-edicao-custo">
        </div>

        <div>
            <label for="input-edicao-valor-atacado">Valor Atacado:</label><br>
            <input type="number" id="input-edicao-valor-atacado">
        </div>

        <div>
            <label for="input-edicao-valor-vaarejo">Valor Varejo:</label><br>
            <input type="number" id="input-edicao-valor-varejo">
        </div>

        <div>
            <label for="input-edicao-qtd">Quantidade:</label><br>
            <input type="number"  id="input-edicao-qtd">
        </div>
    <div id="botao-edicao-container">

        <div>
            <button class="cancelar" onclick="cancelarEdicao()">❌</button>
        </div>

        <div>
            <button class="salvar" onclick="salvarEdicao()">✅</button>
        </div>
        
    </div>  

</dialog>

<dialog id="addCategoria">

    <h2>Nova categoria:</h2>
    
    <div id="container-categorias">
        
        <div>
            <label for="input-categoria-modal">Categoria:</label>
            <input type="text" id="input-categoria-modal" placeholder="digite aqui..." />           
        </div>

        <div class="botao-categoria-container">
            <button class="cancelar" onclick="cancelarCadastroCat()">❌</button>
            <button class="salvar" onclick="salvarCadastroCat()">✅</button>
        </div>


    </div>

    
</dialog>

<dialog id="editar-categoria-modal">

    <div>
        <label for="editar-categoria-input">Categoria:</label>
        <input type="text" id="editar-categoria-input">
    </div>

    <div class="botao-categoria-container">
        <button class="cancelar" onclick="cancelarEdicaoCat()">❌</button>
        <button class="salvar" onclick="salvarEdicaoCat()">✅</button>
    </div>

</dialog>

    <script src="cadastroProduto.js"></script>
</body>
</html>
